openapi: 3.0.0
info:
  title: Game+ Quest Platform API
  version: 1.0.0
  description: API contract for quest, points, leaderboard and badge system.

paths:
  /users:
    get:
      summary: List users with total points
      responses:
        '200':
          description: OK

  /users/{userId}/state:
    get:
      summary: Get user metrics
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

  /leaderboard:
    get:
      summary: Get leaderboard
      responses:
        '200':
          description: OK


